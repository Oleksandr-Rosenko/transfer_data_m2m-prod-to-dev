name: Keep Streamlit App Alive

on:
  schedule:
    # Запуск кожні 5 хвилин для запобігання засинанню Streamlit Cloud (таймаут неактивності ~15 хв)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL вашого Streamlit-додатку (залиште порожнім для використання за замовчуванням)'
        required: false
        default: 'https://transfer-data-m2m-prod-to-dev.streamlit.app'

jobs:
  ping:
    name: Ping Streamlit Container
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP request
        env:
          DEFAULT_URL: 'https://transfer-data-m2m-prod-to-dev.streamlit.app'
          SECRET_URL: ${{ secrets.STREAMLIT_URL }}
          VAR_URL: ${{ vars.STREAMLIT_URL }}
          INPUT_URL: ${{ inputs.app_url }}
        run: |
          TARGET_URL="${INPUT_URL:-${SECRET_URL:-${VAR_URL:-$DEFAULT_URL}}}"
          echo "🎯 Цільовий URL: $TARGET_URL"
          echo "🕒 Час сервера GitHub (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🇺🇦 Локальний час (Київ):     $(TZ='Europe/Kyiv' date '+%Y-%m-%d %H:%M:%S %Z')"

          # Виконуємо HTTP GET без слідування за OAuth-редиректами (-L прибрано, щоб уникнути циклу 303 в приватних додатках)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36 (StreamlitKeepAlive/1.0)" \
            --connect-timeout 10 \
            --max-time 15 \
            "$TARGET_URL" || echo "000")

          echo "📊 HTTP Status Code від роутера Streamlit: $HTTP_CODE"

          # Для Streamlit Cloud статус 200 (публічний) або 302/303 (приватний з авторизацією) означає,
          # що трафік зареєстровано, роутер активний, таймер сну скинуто.
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✅ Успішно! Streamlit Cloud зафіксував активність і тримає контейнер живим."
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "❌ Помилка підключення до сервера."
            exit 1
          else
            echo "⚠️ Отримано статус $HTTP_CODE (роутер відповів, сесія оновлена)."
          fi
